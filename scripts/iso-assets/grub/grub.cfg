set default=0
set timeout=3

# ── Appearance ────────────────────────────────────────────────────────────────
set color_normal=light-gray/black
set color_highlight=white/black

# ── Boot entry ────────────────────────────────────────────────────────────────
menuentry "Pramaan QC Tool — Live USB" {
    # boot=live      → activates live-boot to mount filesystem.squashfs
    # quiet splash   → suppress kernel messages for clean boot experience
    # nomodeset      → prevents GPU driver issues on diverse hardware
    # snd_intel_dspcfg.dsp_driver=1 → use legacy Intel HDA instead of SOF;
    #                                avoids Intel audio DSP timeout on some laptops
    # systemd.unified_cgroup_hierarchy=1 → modern cgroup for systemd
    linux  /live/vmlinuz  boot=live quiet splash nomodeset snd_intel_dspcfg.dsp_driver=1 systemd.unified_cgroup_hierarchy=1
    initrd /live/initrd.img
}

menuentry "Pramaan QC Tool — Verbose Boot (debug)" {
    linux  /live/vmlinuz  boot=live nomodeset snd_intel_dspcfg.dsp_driver=1 systemd.unified_cgroup_hierarchy=1
    initrd /live/initrd.img
}

menuentry "Boot from local disk" {
    chainloader +1
}
