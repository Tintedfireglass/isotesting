name: Validate USB report persistence
on:
  workflow_dispatch:
    inputs:
      build_run:
        description: 'Completed ISO build run ID'
        required: true
      iso_artifact:
        description: 'ISO artifact name from that build'
        required: true
jobs:
  usb-reboot:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    permissions:
      contents: read
      actions: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: ${{ inputs.iso_artifact }}
          run-id: ${{ inputs.build_run }}
          github-token: ${{ github.token }}
          path: download
      - uses: actions/download-artifact@v4
        with:
          name: terminal-regression-snapshots
          run-id: ${{ inputs.build_run }}
          github-token: ${{ github.token }}
          path: render-evidence
      - name: Install isolated VM and disk image tools
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends qemu-system-x86 ovmf tesseract-ocr gdisk
      - name: Verify report recovery on USB reboot
        run: python3 scripts/usb-smoke.py
      - name: Upload USB reboot evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: usb-reboot-smoke-evidence
          path: iso-smoke-output/
          if-no-files-found: ignore
