name: Validate live USB network recovery and Wi-Fi
on:
  workflow_dispatch:
    inputs:
      build_run:
        description: 'Completed ISO build run ID'
        required: true
      iso_artifact:
        description: 'ISO artifact name'
        required: true
jobs:
  network:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    permissions:
      contents: read
      actions: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: ${{ inputs.iso_artifact }}
          run-id: ${{ inputs.build_run }}
          github-token: ${{ github.token }}
          path: download
      - name: Install VM tools
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends qemu-system-x86 ovmf tesseract-ocr
      - name: Verify network Settings, Ethernet recovery and simulated WPA2 Wi-Fi
        env:
          PRAMAAN_BOOT_MODES: bios uefi
          PRAMAAN_NETWORK_QA: '1'
        run: python3 scripts/iso-smoke.py "$(find download -name '*.iso' -print -quit)"
      - name: Upload network evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: network-validation-evidence
          path: iso-smoke-output/
          if-no-files-found: ignore
